            <div class="form-section__form">
                <form method="POST">
                    <div class="form-row row gap-2">
                        <div class="input-group w-1_3">
                            <input type="text" id="name" name="name" class="input inpt-name" data-required="true" data-error="Обязательно для заполнения">
                            <label for="name">Ваше имя *</label>
                          </div>
                          <div class="input-group w-1_3">
                            <input type="email" id="email" name="email" class="input inpt-email" data-required="true" data-error="Обязательно для заполнения">
                            <label for="email">Email *</label>
                          </div>
                          <div class="input-group w-1_3" >
                            <input type="tel" id="tel" name="tel" class="input inpt-tel" data-required="true" data-error="Обязательно для заполнения">
                            <label for="tel">Контакт в Telegram *</label>
                          </div>
                    </div>
                    <div class="form-row row">
                        <div class="input-group w-full" >
                            <textarea name="message" id="message" rows="4" data-error="Please fill this field" class="input input-large inpt-message"></textarea>
                            <label for="message">Сообщение (опционально)</label>
                        </div>
                    </div>
                    <button class="btn btn--primary" type="submit">
                        Отправить
                        <span class="hover-animated-arrow">
                            <img class="hover-animated-arrow__out" src="/assets/img/white-arrow-icon.svg" alt="arrow-icon">
                            <img class="hover-animated-arrow__in" src="/assets/img/white-arrow-icon.svg" alt="arrow-icon">
                        </span>
                    </button>
                    <input type="hidden" name="action" value="call">
                </form>
