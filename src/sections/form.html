                        обратной связи

                    </div>
                </h2>
                <div class="form-section__socials">
                    <a href="" class="social">
                        <svg>
                            <use xlink:href="assets/img/sprite.svg#whatsapp"></use>
                        </svg>
                    </a>
                    <a href="" class="social">
                        <svg>
                            <use xlink:href="assets/img/sprite.svg#instagram"></use>
                        </svg>
                    </a>
                    <a href="" class="social">
                        <svg>
                            <use xlink:href="assets/img/sprite.svg#telegram"></use>
                        </svg>
                    </a>
                </div>
            </div>
            <div class="form-section__form">
                <form method="POST">
                    <div class="form-row row gap-2">
                        <div class="input-group w-1_3">
                            <input type="text" id="name" name="name" class="input inpt-name" data-required="true" data-error="Please fill this field">
                            <label for="name">Ваше имя *</label>
                          </div>
                          <div class="input-group w-1_3">
                            <input type="email" id="email" name="email" class="input inpt-email">
                            <label for="email">Email </label>
                          </div>
                          <div class="input-group w-1_3" >
                            <input type="tel" id="tel" name="tel" class="input inpt-tel" data-required="true" data-error="Please fill this field">
                            <label for="tel">Номер телефона *</label>
                          </div>
                    </div>
                    <div class="form-row row">
                        <div class="input-group w-full" >
                            <input type="text" id="message" name="message" class="input input-large inpt-message" data-error="Please fill this field">
                            <label for="message">Сообщение (опционально)</label>
                          </div>
                    </div>
                    <button class="btn btn--primary" type="submit">
                        Оставить заявку
                        <svg>
                            <use xlink:href="assets/img/sprite.svg#arrow-right-white"></use>
                        </svg>
                    </button>
                    <input type="hidden" name="action" value="call">
                </form>
            </div>
